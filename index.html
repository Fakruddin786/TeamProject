<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Team Task Manager</h1>
            <p class="subtitle">A simple, collaborative task tracker for agile teams</p>
        </header>

        <main>
            <div class="card">
                <!-- Task Input Section (Assigned: Developer 1) -->
                <form id="task-form" class="task-form">
                    <input 
                        type="text" 
                        id="task-input" 
                        class="task-input" 
                        placeholder="What needs to be done? Enter a task..." 
                        autocomplete="off"
                        required
                    />
                    <button type="submit" id="add-task-btn" class="btn btn-primary">
                        <span>+</span> Add Task
                    </button>
                </form>

                <!-- Task List Section -->
                <div class="task-list-header">
                    <h2>Tasks List</h2>
                    <span id="task-counter" class="badge">0 tasks</span>
                </div>

                <ul id="task-list" class="task-list">
                    <!-- Dynamic task items will be rendered here -->
                    <li class="empty-state">No tasks available. Add one above!</li>
                </ul>
            </div>
        </main>

        <footer>
            <p>DevOps Practical Demonstration &bull; Git Branching Strategy &bull; TeamProject</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
